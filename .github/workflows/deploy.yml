name: Deploy PHP App (Phar Method)

on:
  push:
    branches:
      - main # Or whatever branch you want to trigger the deployment

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Adjust to your required version
          ini-values: phar.readonly=0

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Build Phar archive
        run: php build-phar.php

      - name: Prepare Deployment Directory
        run: |
          mkdir dist
          # Copy the built application
          cp pos.phar dist/
          # Copy the entry point and rename it to index.php
          cp host-index.php dist/index.php
          # Copy static assets (served directly by the web server)
          cp public/.htaccess dist/
          cp public/favicon.png dist/
          cp -r public/js dist/js

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          # Ensure it doesn't overwrite database or other user files
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            database.sqlite
