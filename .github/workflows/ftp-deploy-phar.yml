name: Deploy via FTP (Strict PHAR)

on:
  push:
    branches:
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          ini-values: phar.readonly=0

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Build PHAR
        run: php build-phar.php

      - name: Prepare Host Environment
        run: |
          mkdir deploy_package
          
          # 1. Copy the generated pos.phar
          cp pos.phar deploy_package/
          
          # 2. Copy host-index.php and rename it to index.php (this replaces public/index.php)
          cp host-index.php deploy_package/index.php
          
          # 3. Copy static assets (served directly by web server)
          cp public/.htaccess deploy_package/
          cp public/favicon.png deploy_package/
          cp -r public/js deploy_package/js
          cp -r public/css deploy_package/css || true
          cp -r public/images deploy_package/images || true

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: 45.130.228.109
          username: u600962660.mobileadmin
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_package/
          server-dir: /domains/mbpos.encodeunlimited.com/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            database.sqlite
